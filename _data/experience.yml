research:
  - role: Google Summer of Code Contributor
    org: JuliaMolSim, University of Cambridge
    location: Cambridge, UK (remote)
    period: May 2026 - Sept. 2026
    advisor: Dr. Joe G. Greener
    advisor_url: https://scholar.google.com/citations?user=IG6H3tIAAAAJ
    url: https://github.com/JuliaMolSim/Molly.jl
    bullets:
      - Implemented the ANI-2x and E(3)-equivariant (NequIP, Allegro) interatomic potentials natively in Julia for Molly.jl, enabling ML-driven molecular dynamics with no Python runtime and matching TorchANI to about 1e-6 eV/Å.
      - Derived analytic forces via custom backpropagation through the atomic-environment-vector (AEV) and per-element networks, 7-14x faster than autodiff.
      - Wrote portable GPU kernels with KernelAbstractions (CUDA / Metal / ROCm) that scale to proteins of 15,000+ atoms.
      - Benchmarked against TorchANI, NNPOps, and bio-mlff; a write-reduced AEV kernel and on-device CSR made Molly-CUDA the fastest on a full 15,954-atom protein (energy 13 ms, forces 31 ms), up to 125x over host CPU.
    tags: Julia, KernelAbstractions, CUDA, Metal, ML interatomic potentials, molecular dynamics

