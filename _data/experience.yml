    location: Cambridge, USA (remote)
    period: May 2025 - Sept. 2025
    advisor: Dr. Samuel A. Isaacson and Dr. Christopher Rackauckas
    advisor_url: https://scholar.google.com/citations?user=Ap9PfVQAAAAJ
